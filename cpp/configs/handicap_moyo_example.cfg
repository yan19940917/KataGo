# EXPERIMENTAL overlay for this patched source, not a standalone GTP config.
# Add these entries to your existing config, or use a comma-separated
# -override-config argument. Do not add duplicate keys to a config.
#
# Old parameter names retained, but semantics CHANGED:
# complexityBonus = fraction of non-pass ROOT POLICY mass available for
#                   redistribution to contestable opponent-leaning empty areas.
# complexityMaxBonus = upper bound on that fraction, NOT a value/visit bonus.
# The implementation also hard-caps the budget at 0.25 and each prior at 3x.
# Only white in a detected handicap game, while the NN predicts white behind.
# Begins fading after move 140 and stops at 220 (19x19-equivalent turn count).
#
# Initial experiment only, not empirically optimized strength settings.
complexityBonus = 0.08
complexityMinHandicap = 2
complexityMaxBonus = 0.12
#
# Baseline A/B: same patched executable and same remaining config, but set
# complexityBonus=0.0. Turning it off really disables all custom exploration.
#
# Existing GTP handicap inference (use if your client sends repeated black moves):
# assumeMultipleStartingBlackMovesAreHandicap = true
#
# Keep your current playoutDoublingAdvantage / dynamic PDA unchanged in the
# first comparison. Do not change PDA, komi, model, visits, and this patch all
# at once, or you cannot attribute a strength difference to this experiment.
